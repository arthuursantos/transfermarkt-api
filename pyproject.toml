[project]
name = "transfermarkt-api"
version = "3.0.0"
description = "API service to get data from Transfermarkt"
authors = [{ name = "Felipe Allegretti", email = "felipe@allegretti.me" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "lxml>=5.3,<6",
    "beautifulsoup4>=4.12,<5",
    "requests>=2.32.4,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "slowapi>=0.1.9,<1",
    "pydantic-settings>=2.7,<3",
    "pydantic>=2.10,<3",
    "python-dateutil>=2.9,<3",
    "google-adk[a2a]>=1.28,<2",
    "litellm>=1.83.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "jupyter>=1,<2",
    "setuptools>=68,<76",
]
check = [
    "black>=24.8,<25",
    "ruff>=0.6,<1",
    "interrogate>=1.7,<2",
]
tests = [
    "pytest>=7.3,<9",
    "pytest-cov>=4.1,<6",
    "schema>=0.7,<1",
]

[tool.black]
line-length = 120
verbose = true
preview = true

[tool.ruff]
preview = true
unsafe-fixes = true
line-length = 120
lint.select = [
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort
    "COM",  # flake8-commas
    "Q",  # flake8-quotes
    "FAST",  # fastapi
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report term-missing --exitfirst"
testpaths = [
    "tests",
]

[tool.interrogate]
ignore-init-module = true
ignore-module = true
fail-under = 100
